name = "body-make-chips-checkout-sandbox"
main = "src/worker.mjs"
compatibility_date = "2026-10-19"
account_id = "99fab5e9011acdfe4ccdd989e64bdee1"
compatibility_flags = ["nodejs_compat"]

[[rules]]
type = "Text"
globs = ["**/admin/*.html", "**/admin/*.css", "**/admin/admin.js"]
fallthrough = true

[vars]
SITE_ORIGIN = "http://127.0.0.1:4175"
STRIPE_MODE = "test"
SALE_ENABLED = "true"
GA4_MEASUREMENT_ID = "G-1DEZNWRNKR"
PRICE_TRIAL = "price_1USLo32KjzkCozaCd9xf6ZcG"
PRICE_DESK = "price_1USLrp2KjzkCozaCs2NRxuPM"
PRICE_STOCK = "price_1UOY1N2KjzkCozaC5SjItp3X"

[[durable_objects.bindings]]
name = "INVENTORY"
class_name = "Inventory"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Inventory"]

[observability]
enabled = true
head_sampling_rate = 1

# Secrets must be installed with `wrangler secret put`, never committed:
# STRIPE_RESTRICTED_KEY, STRIPE_WEBHOOK_SECRET, TURNSTILE_SECRET_KEY
# Live uses a separate Worker and Durable Object namespace after sandbox verification.
