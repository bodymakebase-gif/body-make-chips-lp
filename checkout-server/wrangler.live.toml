name = "body-make-chips-checkout"
main = "src/worker.mjs"
compatibility_date = "2026-10-19"
account_id = "99fab5e9011acdfe4ccdd989e64bdee1"
compatibility_flags = ["nodejs_compat"]

[[rules]]
type = "Text"
globs = ["**/admin/*.html", "**/admin/*.css", "**/admin/admin.js"]
fallthrough = true

[vars]
SITE_ORIGIN = "https://body-make-chips.jp"
STRIPE_MODE = "live"
SALE_ENABLED = "true"
# Live one-time JPY prices; verify through API after connecting the restricted key.
PRICE_TRIAL = "price_1USN6CRzqHvlt8DAi7d6bNwX"
PRICE_DESK = "price_1USN6lRzqHvlt8DAfkMhNauE"
PRICE_STOCK = "price_1USN7ERzqHvlt8DAvklLmK4I"

[[durable_objects.bindings]]
name = "INVENTORY"
class_name = "Inventory"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Inventory"]

[observability]
enabled = true
head_sampling_rate = 1

# Separate Worker and Durable Object namespace: never reuse sandbox inventory.
# Deploy with: wrangler deploy --config wrangler.live.toml
# Install live Secrets with the same --config argument; never commit their values.
